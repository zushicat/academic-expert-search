services:
  academic-expert-search:
    container_name: academic-expert-search-container
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.ignore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    ports:
      - 10101:80
    restart: on-failure
    command: uvicorn app:app --reload --host 0.0.0.0 --port 80
